# Local LLM stack: Ollama (models) + secured gateway (API) + Open WebUI (chat for staff)
# Start:  docker compose up -d
# Then:   docker compose exec ollama ollama pull llama3.1:8b
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Ollama is NOT published on the host: only the gateway and the UI can reach it.
    expose:
      - "11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gateway:
    build: ./gateway
    restart: unless-stopped
    env_file: .env
    environment:
      UPSTREAM_URL: http://ollama:11434
    ports:
      - "8080:8080"
    depends_on:
      - ollama

  webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
    volumes:
      - webui-data:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - ollama

volumes:
  ollama-models:
  webui-data:
